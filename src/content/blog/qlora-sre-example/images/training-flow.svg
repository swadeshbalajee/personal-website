<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Diagram of a QLoRA fine-tuning pipeline for log classification, from raw logs to a merged adapter used at inference time">
  <rect width="900" height="420" fill="#ffffff" />

  <rect x="30" y="160" width="160" height="80" rx="10" fill="#f0f1f3" stroke="#4b5261" stroke-width="1.5" />
  <text x="110" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1d23">Raw log lines</text>
  <text x="110" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">(illustrative sample set)</text>

  <path d="M192 200H248" stroke="#767e8c" stroke-width="2" marker-end="url(#a)" fill="none" />

  <rect x="250" y="160" width="170" height="80" rx="10" fill="#eaf0fd" stroke="#2454c7" stroke-width="1.5" />
  <text x="335" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1d23">Label + format</text>
  <text x="335" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">severity, service, template</text>

  <path d="M422 200H478" stroke="#767e8c" stroke-width="2" marker-end="url(#a)" fill="none" />

  <rect x="480" y="140" width="190" height="120" rx="10" fill="#e6f5f2" stroke="#0f7b6c" stroke-width="1.5" />
  <text x="575" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1d23">QLoRA fine-tune</text>
  <text x="575" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">4-bit base weights</text>
  <text x="575" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">trainable low-rank adapters</text>
  <text x="575" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">frozen backbone</text>

  <path d="M672 200H728" stroke="#767e8c" stroke-width="2" marker-end="url(#a)" fill="none" />

  <rect x="730" y="160" width="140" height="80" rx="10" fill="#fdf3e0" stroke="#9a6400" stroke-width="1.5" />
  <text x="800" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1d23">Adapter</text>
  <text x="800" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">merged at inference</text>

  <path d="M575 260V320" stroke="#767e8c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)" fill="none" />
  <rect x="440" y="322" width="270" height="60" rx="10" fill="#f1eafb" stroke="#6a3fb5" stroke-width="1.5" />
  <text x="575" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1d23">Evaluation set</text>
  <text x="575" y="366" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5261">held-out labeled logs</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#767e8c" />
    </marker>
  </defs>
</svg>
